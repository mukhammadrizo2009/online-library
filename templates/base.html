<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Online Book</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .navbar {
            background: #1f2937;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
        .brand {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="brand">
        <a href="{% url 'home' %}">📚 Online Book</a>
    </div>

    <div class="nav-links">
        {% if user.is_authenticated %}
            <span style="color:white;">Salom, {{ user.username }}</span>
            <a href="{% url 'logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </div>
</div>

{% block content %}
{% endblock %}

</body>
</html>
