{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kirish - Kitoblar Dunyosi</title>
    
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --color-primary: #d97706;
            --color-primary-light: #fbbf24;
            --color-primary-dark: #b45309;
            
            --color-secondary: #0d9488;
            --color-secondary-light: #14b8a6;
            
            --color-bg: #fffbf5;
            --color-bg-secondary: #fef3e2;
            --color-bg-tertiary: #fff;
            
            --color-text: #292524;
            --color-text-secondary: #57534e;
            --color-text-light: #78716c;
            
            --font-display: 'Fraunces', serif;
            --font-body: 'DM Sans', sans-serif;
            
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
            --radius-2xl: 1.5rem;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            
            --spacing-xs: 0.5rem;
            --spacing-sm: 0.75rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 2.5rem;
        }

        html {
            -webkit-text-size-adjust: 100%;
            height: 100%;
            height: -webkit-fill-available;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, 
                rgba(217, 119, 6, 0.08) 0%, 
                rgba(13, 148, 136, 0.08) 100%),
                var(--color-bg);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            padding: 0;
        }

        /* Simplified background for better mobile performance */
        body::before {
            content: '';
            position: fixed;
            top: -40%;
            right: -25%;
            width: 70vw;
            height: 70vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
            will-change: transform;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -20%;
            width: 60vw;
            height: 60vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, rgba(13, 148, 136, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 25s ease-in-out infinite reverse;
            will-change: transform;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-20px, -20px); }
        }

        /* Mobile-first container */
        .login-container {
            width: 100%;
            max-width: 440px;
            margin: auto;
            padding: var(--spacing-md);
            position: relative;
            z-index: 1;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-box {
            background: var(--color-bg-tertiary);
            padding: var(--spacing-xl) var(--spacing-lg);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
        }

        /* Logo Section */
        .logo-container {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-md);
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.25);
            animation: pulse 2.5s ease-in-out infinite;
        }

        .logo-icon ion-icon {
            font-size: 28px;
            color: white;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        h2 {
            font-family: var(--font-display);
            color: var(--color-text);
            font-size: clamp(1.5rem, 5vw, 1.875rem);
            text-align: center;
            margin-bottom: var(--spacing-xs);
            font-weight: 700;
            line-height: 1.2;
        }

        .subtitle {
            text-align: center;
            color: var(--color-text-secondary);
            font-size: clamp(0.875rem, 3vw, 0.9375rem);
            margin-bottom: var(--spacing-xl);
            line-height: 1.5;
        }

        /* Error Message - Mobile Optimized */
        .error {
            background: linear-gradient(135deg, #fee 0%, #fdd 100%);
            color: #c33;
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-lg);
            font-size: 0.875rem;
            border-left: 3px solid #c33;
            animation: shake 0.4s;
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-sm);
            line-height: 1.5;
        }

        .error ion-icon {
            font-size: 1.25rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* Form - Mobile Optimized */
        form {
            position: relative;
        }

        .input-group {
            position: relative;
            margin-bottom: var(--spacing-lg);
        }

        /* Simplified label for mobile */
        .input-group label {
            display: block;
            color: var(--color-text);
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-light);
            transition: color 0.2s ease;
            pointer-events: none;
            z-index: 1;
        }

        .input-icon ion-icon {
            font-size: 1.25rem;
            display: block;
        }

        input:focus ~ .input-icon {
            color: var(--color-primary);
        }

        /* Input styling - Mobile optimized */
        input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-md) var(--spacing-md) 3rem;
            border: 2px solid #e7e5e4;
            border-radius: var(--radius-lg);
            font-size: 16px; /* Prevents zoom on iOS */
            font-family: var(--font-body);
            transition: all 0.2s ease;
            background: white;
            color: var(--color-text);
            -webkit-appearance: none;
            appearance: none;
            line-height: 1.5;
        }

        input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        input:disabled {
            background: #f5f5f4;
            cursor: not-allowed;
        }

        /* Password toggle - Touch optimized */
        .password-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--color-text-light);
            transition: color 0.2s ease;
            z-index: 2;
            background: none;
            border: none;
            padding: var(--spacing-md);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            touch-action: manipulation;
        }

        .password-toggle ion-icon {
            font-size: 1.25rem;
        }

        .password-toggle:active {
            color: var(--color-primary);
            transform: translateY(-50%) scale(0.95);
        }

        /* Forgot password - Touch optimized */
        .forgot-password {
            text-align: right;
            margin-top: calc(-1 * var(--spacing-sm));
            margin-bottom: var(--spacing-lg);
        }

        .forgot-password a {
            color: var(--color-primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-xs);
            min-height: 44px;
            display: inline-flex;
            align-items: center;
        }

        .forgot-password a:active {
            color: var(--color-primary-dark);
        }

        /* Submit Button - Touch optimized */
        button[type="submit"] {
            width: 100%;
            padding: var(--spacing-md);
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1rem;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(217, 119, 6, 0.3);
        }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button[type="submit"]:active::before {
            width: 300px;
            height: 300px;
        }

        /* Loading state */
        button[type="submit"].loading {
            pointer-events: none;
            opacity: 0.8;
            color: transparent;
        }

        button[type="submit"].loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spinner 0.6s linear infinite;
        }

        @keyframes spinner {
            to { transform: rotate(360deg); }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: var(--spacing-xl) 0;
            gap: var(--spacing-md);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e7e5e4;
        }

        .divider span {
            color: var(--color-text-light);
            font-size: 0.875rem;
            white-space: nowrap;
        }

        /* Register link - Touch optimized */
        .register-link {
            text-align: center;
            font-size: 0.9375rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }

        .register-link a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            padding: var(--spacing-xs);
            min-height: 44px;
            display: inline-flex;
            align-items: center;
        }

        .register-link a:active {
            color: var(--color-primary-dark);
        }

        /* Back to home - Touch optimized */
        .back-home {
            text-align: center;
            margin-top: var(--spacing-lg);
            padding-bottom: var(--spacing-sm);
        }

        .back-home a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-sm) var(--spacing-md);
            min-height: 44px;
            border-radius: var(--radius-md);
            transition: all 0.2s ease;
        }

        .back-home a ion-icon {
            font-size: 1rem;
        }

        .back-home a:active {
            background: var(--color-bg-secondary);
            color: var(--color-primary);
        }

        /* Tablet optimization (landscape phones and small tablets) */
        @media (min-width: 481px) and (max-width: 768px) {
            .login-container {
                padding: var(--spacing-xl);
            }

            .login-box {
                padding: var(--spacing-2xl) var(--spacing-xl);
            }

            h2 {
                font-size: 2rem;
            }

            .logo-icon {
                width: 64px;
                height: 64px;
            }

            .logo-icon ion-icon {
                font-size: 32px;
            }
        }

        /* Desktop optimization */
        @media (min-width: 769px) {
            body {
                justify-content: center;
                padding: var(--spacing-xl);
            }

            .login-container {
                padding: 0;
            }

            .login-box {
                padding: 3rem 2.5rem;
            }

            h2 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .logo-icon {
                width: 70px;
                height: 70px;
            }

            .logo-icon ion-icon {
                font-size: 35px;
            }

            input:hover {
                border-color: var(--color-text-light);
            }

            button[type="submit"]:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
            }

            .forgot-password a:hover {
                text-decoration: underline;
            }

            .register-link a:hover {
                text-decoration: underline;
            }

            .back-home a:hover {
                background: var(--color-bg-secondary);
                color: var(--color-primary);
            }

            .password-toggle:hover {
                color: var(--color-primary);
            }
        }

        /* Small phones */
        @media (max-width: 375px) {
            :root {
                --spacing-xs: 0.375rem;
                --spacing-sm: 0.625rem;
                --spacing-md: 0.875rem;
                --spacing-lg: 1.25rem;
                --spacing-xl: 1.75rem;
                --spacing-2xl: 2.25rem;
            }

            .login-container {
                padding: var(--spacing-sm);
            }

            .login-box {
                padding: var(--spacing-xl) var(--spacing-md);
            }

            .logo-icon {
                width: 50px;
                height: 50px;
            }

            .logo-icon ion-icon {
                font-size: 25px;
            }

            input {
                padding: 0.875rem 0.875rem 0.875rem 2.75rem;
            }

            .input-icon {
                left: 0.875rem;
            }
        }

        /* Landscape mode for phones */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                justify-content: flex-start;
                padding: var(--spacing-md) 0;
            }

            .login-container {
                padding: var(--spacing-md);
                margin: 0 auto;
            }

            .login-box {
                padding: var(--spacing-lg) var(--spacing-md);
            }

            .logo-container {
                margin-bottom: var(--spacing-md);
            }

            .logo-icon {
                width: 44px;
                height: 44px;
                margin-bottom: var(--spacing-sm);
            }

            .logo-icon ion-icon {
                font-size: 22px;
            }

            h2 {
                font-size: 1.5rem;
                margin-bottom: 0.25rem;
            }

            .subtitle {
                font-size: 0.8125rem;
                margin-bottom: var(--spacing-md);
            }

            .input-group {
                margin-bottom: var(--spacing-md);
            }

            .divider {
                margin: var(--spacing-md) 0;
            }

            .back-home {
                margin-top: var(--spacing-md);
            }
        }

        /* Very small phones in landscape */
        @media (max-height: 500px) and (orientation: landscape) {
            .logo-container {
                margin-bottom: var(--spacing-sm);
            }

            .logo-icon {
                display: none;
            }

            h2 {
                font-size: 1.25rem;
            }

            .subtitle {
                display: none;
            }

            .error {
                padding: var(--spacing-sm);
                font-size: 0.8125rem;
            }

            .input-group {
                margin-bottom: var(--spacing-sm);
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            /* Can add dark mode styles if needed */
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* iOS Safe Area Support */
        @supports (padding: max(0px)) {
            .login-container {
                padding-left: max(var(--spacing-md), env(safe-area-inset-left));
                padding-right: max(var(--spacing-md), env(safe-area-inset-right));
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div class="logo-container">
            <div class="logo-icon">
                <ion-icon name="library-outline"></ion-icon>
            </div>
            <h2>Xush kelibsiz</h2>
            <p class="subtitle">Davom etish uchun tizimga kiring</p>
        </div>

        {% if error %}
            <div class="error">
                <ion-icon name="alert-circle-outline"></ion-icon>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="post" id="loginForm" autocomplete="on">
            {% csrf_token %}

            <div class="input-group">
                <label for="username">Foydalanuvchi nomi</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        name="username" 
                        id="username"
                        required 
                        autocomplete="username"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                        inputmode="text">
                    <span class="input-icon">
                        <ion-icon name="person-outline"></ion-icon>
                    </span>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Parol</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        name="password" 
                        id="password"
                        required 
                        autocomplete="current-password">
                    <span class="input-icon">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                    </span>
                    <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Parolni ko'rsatish yoki yashirish">
                        <ion-icon name="eye-outline" id="eyeIcon"></ion-icon>
                    </button>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#" tabindex="0">Parolni unutdingizmi?</a>
            </div>

            <button type="submit">Kirish</button>
        </form>


        <div class="divider">
            <span>yoki</span>
        </div>

        <div class="register-link">
            Akkount yo'qmi?
            <a href="{% url 'register' %}" tabindex="0">Ro'yxatdan o'tish</a>
        </div>

        <div class="back-home">
            <a href="/" tabindex="0">
                <ion-icon name="arrow-back-outline"></ion-icon>
                Bosh sahifaga qaytish
            </a>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.setAttribute('name', 'eye-off-outline');
        } else {
            passwordInput.type = 'password';
            eyeIcon.setAttribute('name', 'eye-outline');
        }
    }

    // Form submission with loading state
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const button = this.querySelector('button[type="submit"]');
        const inputs = this.querySelectorAll('input');
        
        button.classList.add('loading');
        inputs.forEach(input => input.disabled = true);
    });

    // Smooth scroll on focus for mobile
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', function() {
            setTimeout(() => {
                this.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        });
    });

    // Prevent double-tap zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, { passive: false });

    // Add haptic feedback for buttons (if supported)
    if ('vibrate' in navigator) {
        document.querySelectorAll('button, a').forEach(element => {
            element.addEventListener('touchstart', function() {
                navigator.vibrate(10);
            }, { passive: true });
        });
    }

    // Handle viewport height changes (mobile keyboard)
    const setViewportHeight = () => {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    };

    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', setViewportHeight);

    // Auto-focus first input on desktop
    if (window.innerWidth >= 768) {
        window.addEventListener('load', () => {
            document.getElementById('username').focus();
        });
    }
</script>

</body>
</html>
